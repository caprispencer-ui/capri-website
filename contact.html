<body>
  <header class="site-header">
    <a class="logo" href="index.html">captured by capri</a>
    <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav">Menu</button>
    <nav class="site-nav" id="site-nav" aria-label="Main">
      <ul>

  <main>
    <section class="section">
      <div class="container split">
        <img src="assets/photos/IMG_2641.jpg" alt="Session photo by Capri" loading="lazy">
        <div>
          <span class="eyebrow">Contact</span>
          <h1>Contact me</h1>
          <form data-formspree action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
            <input type="hidden" name="_subject" value="New message from your website">
            <label>Name *<input type="text" name="name" required autocomplete="name"></label>
            <label>Email address *<input type="email" name="email" required autocomplete="email"></label>
            <label>Message *<textarea name="message" required></textarea></label>
            <div><button class="button" type="submit">Send message</button></div>
            <p class="form-status" role="status"></p>
          </form>
          <p class="form-note" style="margin-top: 24px">You can also message me on <a href="https://instagram.com/captured.by.capri">Instagram @captured.by.capri</a>.</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <h2>Get in touch</h2>
    <a class="button" href="contact.html">Contact me</a>
    <br>
    <a class="social" href="https://instagram.com/captured.by.capri">Instagram @captured.by.capri</a>
