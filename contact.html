  <main>
    <section class="section">
      <div class="container split">
        <img src="assets/photos/web/IMG_2641.webp" alt="Girl in a field of dried thistles reaching toward the lake at sunset" width="1000" height="1500" fetchpriority="high">
        <div>
          <span class="eyebrow">Contact</span>
          <h1>Contact me</h1>
          <form data-formsubmit action="https://formsubmit.co/caprispencer@gmail.com" method="POST">
            <input type="hidden" name="_subject" value="New message from your website">
            <input type="hidden" name="_template" value="table">
            <input type="hidden" name="_captcha" value="false">
            <input type="text" name="_honey" class="honey" tabindex="-1" autocomplete="off" aria-hidden="true">
            <label>Name *<input type="text" name="name" required autocomplete="name"></label>
            <label>Email address *<input type="email" name="email" required autocomplete="email"></label>
            <label>Message *<textarea name="message" required></textarea></label>
            <div><button class="button" type="submit">Send message</button></div>
            <p class="form-status" role="status"></p>
          </form>
          <p class="form-note" style="margin-top: 24px">You can also message me on <a href="https://instagram.com/captured.by.capri">Instagram @captured.by.capri</a>.</p>
        </div>
      </div>
    </section>
