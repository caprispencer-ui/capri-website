name: Fetch photos from Pixieset (one-time)

on:
  push:
    branches: [copy-pixieset-site]
    paths: [.github/workflows/fetch-photos.yml]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download photos
        run: |
          mkdir -p assets/photos
          grep -oh 'images-pw.pixieset.com/site/g5PMQe/[^"'"'"')]*' *.html | sort -u | while read -r u; do
            name=$(basename "$u" | sed -E 's/-[0-9a-f]{8}-1500\.jpg$/.jpg/')
            curl -fsSL "https://$u" -o "assets/photos/$name"
          done
          ls -la assets/photos
      - name: Commit photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/fetch-photos.yml
          git add assets/photos
          git commit -m "Add photos downloaded from Pixieset"
          git push
