    <section class="page-title">
      <span class="eyebrow">Session Inquiry</span>
      <h1>Let's book your session</h1>
      <p>For seniors, couples, families, branding and more.</p>
    </section>

    <section class="section" style="padding-top: 0">
      <div class="narrow">
        <form data-formspree action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
          <input type="hidden" name="_subject" value="New session inquiry">
          <label>Name *<input type="text" name="name" required autocomplete="name"></label>
          <label>Email address *<input type="email" name="email" required autocomplete="email"></label>
          <label>Phone number *<input type="tel" name="phone" required autocomplete="tel"></label>
          <label>What type of session are you wanting to book? *
            <select name="session_type" required><option value="">Choose one</option><option>Individual</option><option>Senior</option><option>Couple</option><option>Family</option><option>School Dance</option><option>Branding</option><option>Something else</option></select>
          </label>
          <label>Desired date and time *<input type="datetime-local" name="date_time" required></label>
          <label>Location *<input type="text" name="location" required placeholder="Anywhere in Utah County"></label>
          <div><button class="button" type="submit">Send message</button></div>
          <p class="form-status" role="status"></p>
        </form>
      </div>
    </section>
